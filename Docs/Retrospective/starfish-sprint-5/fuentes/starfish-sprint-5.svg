<text x="977.2" y="682.1" class="i">• Reuniones del equipo</text>
<text x="977.2" y="706.1" class="i">• Documentación</text>
<text x="977.2" y="730.1" class="i">• Diagramas</text>
<text x="977.2" y="754.1" class="i">• Aprovechar mejor el tiempo</text>
<text x="977.2" y="778.1" class="i">• Cuidar la presentación del GitHub</text>
<path d="M 700 640 L 1011.5 1068.8 A 530 530 0 0 1 388.5 1068.8 Z" fill="#F6E58D" stroke="#1F3B57" stroke-width="2"/>
