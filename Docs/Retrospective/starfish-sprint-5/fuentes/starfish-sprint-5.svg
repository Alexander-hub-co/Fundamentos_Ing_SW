<text x="528.7" y="356.2" class="i">• Procrastinar</text>
<text x="528.7" y="380.2" class="i">• Perder tiempo en cosas innecesarias</text>
<text x="528.7" y="404.2" class="i">• Buscar excusas en vez de soluciones</text>
<text x="528.7" y="428.2" class="i">• Dejarle todo a un solo integrante</text>
<text x="528.7" y="452.2" class="i">• Faltar a clase</text>
