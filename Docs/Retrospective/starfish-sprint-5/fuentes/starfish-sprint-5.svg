<text x="700" y="52" class="h">Retrospectiva Starfish — Sprint 5</text>
<text x="700" y="80" class="s">Parquivo · 22 de octubre de 2026 · aportes del equipo agrupados por idea</text>
<path d="M 700 640 L 700.0 110.0 A 530 530 0 0 1 1204.1 476.2 Z" fill="#7CCBF2" stroke="#1F3B57" stroke-width="2"/>
<text x="980.4" y="262.1" class="t">EMPEZAR A HACER</text>
<text x="871.3" y="344.2" class="i">• Respetar el horario de los dailys</text>
<text x="871.3" y="368.2" class="i">• Planear cada sección del proyecto</text>
<text x="871.3" y="392.2" class="i">• Revisar el repositorio y corregir incoherencias</text>
<text x="871.3" y="416.2" class="i">• Exigirnos más entre compañeros</text>
<text x="871.3" y="440.2" class="i">• Trabajar sin esperar a que llegue una entrega</text>
<text x="871.3" y="464.2" class="i">• Pensar en marketing y venta del producto</text>
<path d="M 700 640 L 1204.1 476.2 A 530 530 0 0 1 1011.5 1068.8 Z" fill="#A8DDB5" stroke="#1F3B57" stroke-width="2"/>
