<text x="700.0" y="931.5" class="i">• La buena actitud del grupo</text>
<path d="M 700 640 L 388.5 1068.8 A 530 530 0 0 1 195.9 476.2 Z" fill="#F6C177" stroke="#1F3B57" stroke-width="2"/>
<text x="246.3" y="795.4" class="t">HACER MENOS</text>
<text x="422.8" y="718.1" class="i">• Desorden y confusión en el GitHub</text>
<text x="422.8" y="742.1" class="i">• Falta de seriedad con el proyecto</text>
<path d="M 700 640 L 195.9 476.2 A 530 530 0 0 1 700.0 110.0 Z" fill="#F4A6A6" stroke="#1F3B57" stroke-width="2"/>
