# Configuración de SonarQube para el taller de análisis de calidad.
# El token NO va aquí: se pasa con la variable de entorno SONAR_TOKEN.
sonar.projectKey=fis-parquivo
sonar.projectName=Parquivo (Fundamentos_Ing_SW)
sonar.host.url=http://localhost:9000

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
# Las migraciones las genera drizzle-kit; no es código escrito a mano.
sonar.exclusions=src/db/migraciones/**
